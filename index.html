<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Le Fauteuil Éco-Droit : jeu de révision du vocabulaire d'économie-droit pour les 2MRC, en solo ou en équipes (M. Frison).">
<title>Le Fauteuil Éco-Droit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap">
<style>
:root{
  --night:#17123F; --stage:#251C5E; --stage-2:#33287A; --velvet:#C8213F; --velvet-d:#8E1530;
  --brass:#F2B632; --brass-l:#FFD978; --card:#FFF8EA; --ink:#1D1745; --muted:#6C6496;
  --cash:#F2B632; --carre:#22B3A6; --duo:#5B8CFF; --ok:#2FBF71; --no:#FF5A5F;
  --f-logo:"Comic Sans MS","Comic Sans","Comic Neue",cursive; --f-display:"Comic Sans MS","Comic Sans","Comic Neue",cursive; --f-body:"Comic Sans MS","Comic Sans","Comic Neue",cursive;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:#F4F0FF;font-family:var(--f-body);font-size:18px;line-height:1.45;
  background:radial-gradient(ellipse 60% 70% at 50% -10%,rgba(255,217,120,.22),transparent 60%),
             repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 120px),
             linear-gradient(180deg,var(--stage) 0%,var(--night) 70%)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.08;text-wrap:balance}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--brass-l);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.logo{font-family:var(--f-logo);font-weight:700;font-size:22px;color:var(--brass);letter-spacing:.02em;background:none;border:0;padding:0}
.logo small{display:block;font-family:var(--f-body);font-size:13px;color:#BDB4E6;letter-spacing:0}
.tbtn{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 14px;font-size:15px}
.btn{border:0;border-radius:14px;padding:14px 22px;font-family:var(--f-display);font-weight:800;font-size:20px;background:var(--brass);color:var(--ink);box-shadow:0 5px 0 #B9861A;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #B9861A}
.btn.alt{background:#fff;box-shadow:0 5px 0 #B7B0DA}
.btn.ghost{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.4);box-shadow:none}
.btn.red{background:var(--velvet);color:#fff;box-shadow:0 5px 0 var(--velvet-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Plateau d'accueil */
.stagehero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;margin-top:8px}
.stagehero h1{font-size:clamp(40px,6vw,76px);letter-spacing:-.01em}
.stagehero h1 span{display:block;font-family:var(--f-logo);font-size:.62em;color:var(--brass);letter-spacing:.01em;font-weight:400}
.lead{color:#D8D1F5;margin:14px 0 22px;max-width:52ch}
.chair{position:relative;max-width:440px;margin:0 auto}
.chair svg{width:100%;height:auto;display:block;filter:drop-shadow(0 30px 30px rgba(0,0,0,.45))}
.plaque{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:linear-gradient(180deg,var(--brass-l),var(--brass));color:var(--ink);border-radius:8px;padding:6px 16px;text-align:center;min-width:62%;box-shadow:0 4px 0 #9A6C10}
.plaque b{display:block;font-family:var(--f-logo);font-size:20px;line-height:1.1}
.plaque span{font-size:14px;font-weight:700}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.mode{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18);border-radius:18px;padding:18px;text-align:left;display:grid;gap:6px}
.mode:hover{border-color:var(--brass)}
.mode h3{font-size:24px}
.mode p{color:#CFC7F0;font-size:16px}
.row .th{color:var(--ink)}
.rules{margin-top:26px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rule{border-top:4px solid var(--brass);padding-top:10px}
.rule h3{font-size:19px;margin-bottom:4px}
.rule p{font-size:15.5px;color:#CFC7F0}
.pts{display:inline-flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border-radius:999px;padding:2px 10px;font-weight:700;font-size:14px;color:var(--ink)}
.chip.cash{background:var(--cash)} .chip.carre{background:var(--carre)} .chip.duo{background:var(--duo);color:#fff}

/* Panneaux */
.panel{background:var(--card);color:var(--ink);border-radius:22px;padding:24px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.panel h2{font-size:30px;margin-bottom:6px}
.panel .sub{color:var(--muted);margin-bottom:16px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:700}
.field input{border:3px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff;max-width:420px}
.teams{display:grid;gap:8px;max-width:520px}
.teams .t{display:flex;gap:8px}
.teams input{flex:1;min-width:0}
.field input{width:100%}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.game{border:2px solid #E3DCC8;border-radius:16px;padding:12px 14px;background:#fff}
.game h3{font-size:19px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.game h3 small{font-family:var(--f-body);font-weight:400;font-size:14px;color:var(--muted)}
.th{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:8px}
.th input{width:22px;height:22px;accent-color:var(--velvet)}
.th.locked{opacity:.5}
.th .lk{margin-left:auto;font-size:13px;color:var(--muted)}
.note{background:#FFF0C7;border-left:6px solid var(--brass);border-radius:10px;padding:10px 14px;margin:12px 0;color:var(--ink)}
.err{background:#FFE1E1;border-left:6px solid var(--no);border-radius:10px;padding:10px 14px;margin:12px 0;color:var(--ink)}

/* Jeu */
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.phase{font-family:var(--f-display);font-weight:800;font-size:22px}
.phase small{display:block;font-family:var(--f-body);font-weight:400;font-size:15px;color:#BDB4E6}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.pl{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.15);border-radius:14px;padding:10px 12px;display:grid;gap:2px}
.pl b{font-family:var(--f-display);font-size:18px;overflow-wrap:anywhere}
.pl .sc{font-family:var(--f-logo);font-size:28px;color:var(--brass)}
.pl.cur{border-color:var(--brass);background:rgba(242,182,50,.14)}
.pl.out{opacity:.38;text-decoration:line-through}
.pl.champ{border-color:var(--velvet);background:rgba(200,33,63,.22)}
.who{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-logo);font-size:24px;background:var(--brass);color:var(--ink);flex:none}
.avatar.champ{background:var(--velvet);color:#fff}
.who h2{font-size:28px}
.themes2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tcard{background:var(--card);color:var(--ink);border:0;border-radius:20px;padding:22px;text-align:left;display:grid;gap:8px;min-height:150px;box-shadow:0 8px 0 #CFC4A6}
.tcard:hover{transform:translateY(-2px)}
.tcard small{color:var(--muted);font-size:15px}
.tcard b{font-family:var(--f-display);font-size:28px;line-height:1.1}
.qcard{background:var(--card);color:var(--ink);border-radius:22px;padding:26px 28px;box-shadow:0 10px 0 #CFC4A6}
.qcard .tn{color:var(--muted);font-size:16px;margin-bottom:8px}
.qcard h2{font-size:clamp(26px,3.4vw,40px)}
.mchoice{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.mbtn{border:0;border-radius:18px;padding:18px 14px;color:var(--ink);display:grid;gap:4px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.mbtn b{font-family:var(--f-logo);font-size:30px}
.mbtn span{font-weight:700}
.mbtn.cash{background:var(--cash)} .mbtn.carre{background:var(--carre)} .mbtn.duo{background:var(--duo);color:#fff}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.ans{border:3px solid transparent;border-radius:16px;padding:16px 18px;text-align:left;background:#fff;color:var(--ink);font-size:21px;font-weight:700;display:flex;gap:12px;align-items:center;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.ans i{font-style:normal;font-family:var(--f-logo);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--stage-2);color:#fff}
.ans.ok{background:var(--ok);color:#fff}
.ans.no{background:var(--no);color:#fff}
.ans:disabled{cursor:default}
.cashbox{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.cashbox input{flex:1;min-width:220px;border:3px solid var(--ink);border-radius:14px;padding:14px 16px;font-size:21px;background:#fff;color:var(--ink)}
.reveal{margin-top:18px;background:var(--stage-2);color:#fff;border-radius:16px;padding:16px 18px;font-size:22px}
.reveal b{color:var(--brass-l)}
.verdict{margin-top:16px;font-family:var(--f-display);font-weight:800;font-size:30px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
.timer{height:10px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:16px}
.timer i{display:block;height:100%;background:var(--brass);width:100%}
.next{margin-top:20px;display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.botline{margin-top:16px;font-size:20px;color:#E9E3FF}
.duelbar{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-bottom:16px}
.duelside{background:rgba(255,255,255,.07);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.duelside.on{outline:4px solid var(--brass)}
.duelside .sc{font-family:var(--f-logo);font-size:36px;color:var(--brass);margin-left:auto}
.vs{font-family:var(--f-logo);font-size:30px;color:var(--velvet)}
.dots{display:flex;gap:6px;margin-top:4px}
.dots span{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18)}
.dots span.ok{background:var(--ok)} .dots span.no{background:var(--no)}
.endscene{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.endscene h1{font-size:clamp(36px,5vw,64px)}
.wobble{animation:wob 1s ease-in-out 2}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.hall{margin-top:16px;display:grid;gap:6px}
.hall div{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.15);padding:6px 0}
.small{font-size:15px;color:#BDB4E6}
.panel .small{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:760px){
  .stagehero,.endscene{grid-template-columns:1fr}
  .chair{max-width:300px}
  .modes,.rules,.themes2,.answers{grid-template-columns:1fr}
  .mchoice{grid-template-columns:1fr}
  .duelbar{grid-template-columns:1fr}
  .vs{text-align:center}
  .btn{font-size:18px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="logo" data-act="home" aria-label="Retour à l'accueil">LE FAUTEUIL ÉCO-DROIT<small>Révisions d'économie-droit · 2MRC · M. Frison</small></button>
    <div class="row"><button class="tbtn" data-act="sound" id="sndbtn">Son : oui</button><button class="tbtn" data-act="themes">Thèmes</button></div>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<script>
/* Banque de questions. Chaque question : [question, bonne réponse, leurre 1, leurre 2, leurre 3]
   Les thèmes sont débloqués par les missions des jeux (clé de sauvegarde + identifiant de mission). */
const THEMES = [
  /* ---------- MODULE 1 · URBAN SHOP ---------- */
  { id: "u1", game: "Urban Shop", name: "Économie ou droit ?", key: "U", m: "m1", qs: [
    ["Comment appelle-t-on l'ensemble des règles qui organisent la vie en société ?", "Le droit", "L'économie", "La morale", "Le marché"],
    ["Quelles sont les trois activités de l'économie ?", "Production, consommation, échanges", "Vente, achat, publicité", "Travail, salaire, impôts", "Offre, demande, prix"],
    ["Fabriquer un bien ou fournir un service, c'est…", "Produire", "Consommer", "Échanger", "Épargner"],
    ["Une casquette est…", "Un bien", "Un service", "Un flux monétaire", "Une règle de droit"],
    ["Une retouche de pantalon est…", "Un service", "Un bien", "Un marché", "Une production non marchande"],
    ["Le magasin doit afficher ses prix : cela relève…", "Du droit", "De l'économie seulement", "De la politesse", "De la morale"],
    ["Quelle notion relève à la fois de l'économie et du droit ?", "Le prix", "La couleur d'un sweat", "Le nom du magasin", "La météo"]
  ] },
  { id: "u7", game: "Urban Shop", name: "La règle de droit", key: "U", m: "m1", qs: [
    ["Une règle qui s'applique à tous ceux qui sont dans la même situation est…", "Générale", "Facultative", "Personnelle", "Morale"],
    ["Que risque-t-on si on ne respecte pas une règle de droit ?", "Une sanction de l'État", "Rien du tout", "Une remarque d'un ami", "Un carton jaune"],
    ["« Dire bonjour aux clients » est une règle…", "De politesse", "De droit", "Européenne", "Constitutionnelle"],
    ["Qui vote les lois en France ?", "Le Parlement", "Le maire", "Le Président seul", "Les juges"],
    ["Quel texte est au sommet de la hiérarchie des normes ?", "La Constitution", "La loi", "Le contrat", "Le décret"],
    ["Un décret ou un arrêté est…", "Un règlement", "Une loi", "Un contrat", "Une décision de justice"],
    ["Un contrat doit respecter…", "La loi et les règles supérieures", "Uniquement l'avis du vendeur", "Rien", "Les règles du football"]
  ] },
  { id: "u2", game: "Urban Shop", name: "Les agents économiques", key: "U", m: "m2", qs: [
    ["Léa achète un jean pour elle : quel agent économique est-elle ?", "Un ménage", "Une entreprise", "Une administration publique", "Le reste du monde"],
    ["Une banque qui prête de l'argent est…", "Une institution financière", "Un ménage", "Une administration publique", "Le reste du monde"],
    ["La mairie qui entretient les rues est…", "Une administration publique", "Une entreprise", "Une institution financière", "Un ménage"],
    ["Un fabricant installé au Portugal fait partie…", "Du reste du monde", "Des ménages", "Des administrations publiques", "Des institutions financières"],
    ["Le rôle principal des entreprises est de…", "Produire et vendre des biens et services", "Prélever des impôts", "Financer l'économie", "Voter les lois"],
    ["L'école publique gratuite est une production…", "Non marchande", "Marchande", "Étrangère", "Financière"],
    ["Les agents ont besoin les uns des autres : ils sont…", "Interdépendants", "Indépendants", "Concurrents", "Identiques"]
  ] },
  { id: "u3", game: "Urban Shop", name: "Les échanges et les flux", key: "U", m: "m3", qs: [
    ["La livraison de 50 vestes au magasin est un flux…", "Réel", "Monétaire", "Financier", "Juridique"],
    ["Le paiement d'une facture est un flux…", "Monétaire", "Réel", "Matériel", "De travail"],
    ["Le travail d'un vendeur est un flux…", "Réel", "Monétaire", "Bancaire", "Fiscal"],
    ["Le salaire versé au vendeur est un flux…", "Monétaire", "Réel", "De marchandises", "Gratuit"],
    ["Dans un échange, flux réel et flux monétaire circulent…", "En sens inverse", "Dans le même sens", "Jamais ensemble", "Seulement à l'étranger"],
    ["Que reçoivent les ménages des entreprises dans le circuit économique ?", "Des salaires, des biens et services", "Des impôts", "Du travail", "Des lois"],
    ["Urban Shop paie ses impôts : le flux monétaire va vers…", "Les administrations publiques", "Les ménages", "Le reste du monde", "Les clients"]
  ] },
  { id: "u4", game: "Urban Shop", name: "Les marchés", key: "U", m: "m4", qs: [
    ["Un marché, c'est la rencontre entre…", "Une offre et une demande", "Deux magasins", "Un juge et un client", "L'État et les impôts"],
    ["Un site de vente en ligne est un marché…", "Virtuel", "Réel", "Interdit", "Public"],
    ["Urban Shop recrute un vendeur : sur quel marché ?", "Le marché du travail", "Le marché des capitaux", "Le marché des biens et services", "Le marché aux puces"],
    ["Une entreprise emprunte à sa banque : sur quel marché ?", "Le marché des capitaux", "Le marché du travail", "Le marché des biens et services", "Le marché de gros"],
    ["Sur le marché du travail, qui offre du travail ?", "Les salariés et les candidats", "Les entreprises", "Les banques", "L'État seulement"],
    ["Ce que les vendeurs proposent à la vente, c'est…", "L'offre", "La demande", "Le prix", "Le stock de sécurité"],
    ["Ce que les acheteurs souhaitent acheter, c'est…", "La demande", "L'offre", "La production", "Le salaire"]
  ] },
  { id: "u5", game: "Urban Shop", name: "Pourquoi les prix changent", key: "U", m: "m5", qs: [
    ["Demande forte et offre limitée : le prix peut…", "Augmenter", "Diminuer", "Disparaître", "Rester bloqué par la loi"],
    ["Offre importante et demande faible : le prix peut…", "Diminuer", "Augmenter", "Doubler", "Rester toujours stable"],
    ["100 sweats pour 95 clients : le prix peut…", "Rester stable", "Exploser", "Être divisé par deux", "Être interdit"],
    ["À quoi servent les soldes ?", "Écouler un stock quand la demande est faible", "Augmenter les prix", "Recruter des vendeurs", "Payer les impôts"],
    ["Une paire en édition limitée est chère car…", "La demande est forte et l'offre limitée", "L'offre est très importante", "L'État fixe son prix", "Personne n'en veut"],
    ["Le prix dépend de la rencontre entre…", "L'offre et la demande", "Le vendeur et sa banque", "Le juge et l'avocat", "Le client et l'État"],
    ["On écrit « le prix peut augmenter » car c'est…", "Une tendance, pas une obligation", "Une règle de droit", "Une loi votée", "Toujours vrai"]
  ] },
  /* ---------- MODULE 1 · MOVE CLUB ---------- */
  { id: "v1", game: "Move Club", name: "À quoi sert le droit ?", key: "U", m: "m7", qs: [
    ["Un juge décide qui a raison dans un litige : quelle fonction du droit ?", "Régler les conflits", "Sanctionner", "Organiser la vie en société", "Protéger les personnes"],
    ["Les normes de sécurité des appareils de sport servent à…", "Protéger les personnes", "Régler les conflits", "Sanctionner", "Faire de la publicité"],
    ["Un voleur est condamné à une amende : quelle fonction ?", "Sanctionner", "Protéger", "Organiser", "Informer"],
    ["Une règle de droit qui ne vise personne nommément est…", "Abstraite", "Morale", "Facultative", "Privée"],
    ["« Respecter le hors-jeu au football » est une règle…", "Du jeu", "De droit", "Européenne", "Pénale"],
    ["Ne pas fumer dans une salle de sport est…", "Une règle de droit", "Une règle de politesse", "Une règle morale", "Un conseil"],
    ["Sans droit, ce serait…", "La loi du plus fort", "Plus juste", "Plus calme", "Plus simple pour les juges"]
  ] },
  { id: "v2", game: "Move Club", name: "Les sources du droit", key: "U", m: "m8", qs: [
    ["Dans un État de droit…", "Tout le monde, y compris l'État, respecte le droit", "L'État fait ce qu'il veut", "Il n'y a pas de juges", "Seuls les citoyens obéissent"],
    ["En quelle année a été adoptée la Constitution actuelle ?", "1958", "1789", "1945", "2000"],
    ["Un décret est pris par…", "Le Gouvernement", "Le Parlement", "Le maire", "Un juge"],
    ["Un arrêté municipal est pris par…", "Le maire", "Le Sénat", "L'Union européenne", "Le Président"],
    ["Le RGPD est…", "Un règlement européen", "Une loi française", "Un arrêté du maire", "Un contrat"],
    ["Une directive européenne doit être…", "Transposée dans la loi de chaque pays", "Appliquée sans rien faire", "Votée par les maires", "Signée par chaque citoyen"],
    ["Un règlement européen s'applique…", "Directement dans tous les pays de l'Union", "Seulement en Belgique", "Après un référendum", "Jamais en France"]
  ] },
  { id: "v3", game: "Move Club", name: "La hiérarchie des normes", key: "U", m: "m9", qs: [
    ["Qu'est-ce qui est supérieur ?", "La loi", "Le décret", "L'arrêté", "Le contrat"],

  const m = Math.random() < 0.2 ? "cash" : Math.random() < 0.7 ? "carre" : "duo";
  setTimeout(() => {
    chooseMode(m);
    stopTimer();
    const acc = Math.min(0.95, p.acc + (m === "duo" ? 0.2 : m === "cash" ? -0.12 : 0));
    setTimeout(() => {
      const c = G.cur;
      if (m === "cash") { c.revealed = true; cashVerdict(Math.random() < acc); }
      else answer(Math.random() < acc ? c.q.a : c.opts.filter((o) => o !== c.q.a)[0]);
    }, 1400);
  }, 1100);
}
function nextTurn() {
  G.turn++;
  if (G.turn >= alive().length) {
    G.turn = 0; G.asked++;
    if (G.asked >= G.qPerRound) { endRound(); return; }
  }
  startTurn();
}
function endRound() {
  stopTimer();
  const al = alive(), low = Math.min(...al.map((p) => p.score)), tied = al.filter((p) => p.score === low);
  G.step = "roundend";
  if (tied.length === al.length && al.length > 1 && tied.length > 1) {
    G.tie = { list: tied, idx: 0, res: {} };
  } else if (tied.length > 1) {
    G.tie = { list: tied, idx: 0, res: {} };
  } else { tied[0].out = true; G.elim = [tied[0]]; G.tie = null; }
  render();
}
/* départage : chaque ex-aequo répond à une question Carré */
function startTie() {
  const tie = G.tie, p = tie.list[tie.idx];
  const q = pickQuestion(G.themes[rnd(G.themes.length)]);
  G.cur = { tieFor: p, q, mode: "carre", opts: shuffle([q.a].concat(q.d)), pick: null, ok: null };
  G.step = "tie";
  render();
  if (p.bot) setTimeout(() => { const ok = Math.random() < p.acc; tieAnswer(ok ? G.cur.q.a : G.cur.opts.find((o) => o !== G.cur.q.a)); }, 1600);
}
function tieAnswer(opt) {
  const c = G.cur; c.pick = opt; c.ok = opt === c.q.a; beep(c.ok ? "ok" : "no");
  G.tie.res[c.tieFor.name] = c.ok;
  G.step = "tieres"; render();
}
function tieNext() {
  const tie = G.tie;
  tie.idx++;
  if (tie.idx < tie.list.length) { startTie(); return; }
  const wrong = tie.list.filter((p) => !tie.res[p.name]), right = tie.list.filter((p) => tie.res[p.name]);
  if (wrong.length && right.length) {
    const al = alive();
    // on élimine les perdants du départage, mais il doit rester au moins un joueur
    const toOut = wrong.length >= al.length ? wrong.slice(0, al.length - 1) : wrong;
    toOut.forEach((p) => (p.out = true)); G.elim = toOut; G.tie = null; G.step = "roundend"; render();
  } else { tie.idx = 0; tie.res = {}; startTie(); }
}
function afterRound() {
  G.elim = null;
  if (G.mode === "solo" && G.players.some((p) => p.human && p.out)) { G.result = { eliminated: true, winner: { name: "" } }; P.solo.games++; P.solo.reign = 0; saveP(); G.step = "end"; render(); return; }
  if (alive().length <= 1) { startDuel(); return; }
  G.round++; G.asked = 0; G.turn = 0;
  alive().forEach((p) => (p.score = 0));
  startTurn();
}
function simulateQualifs() {
  const ps = G.players.map((p) => ({ p, s: 0 }));
  for (let k = 0; k < 6; k++) ps.forEach((x) => { if (Math.random() < x.p.acc) x.s += 2; });
  ps.sort((a, b) => b.s - a.s);
  ps.slice(1).forEach((x) => (x.p.out = true));
  G.simWinner = ps[0].p;
  G.step = "simdone";
  render();
}

/* ---------- Duel ---------- */
function startDuel() {
  stopTimer();
  const fin = alive()[0];
  if (!G.champion) { G.result = { winner: fin, newChamp: true, noChamp: true }; finish(); return; }
  G.duel = { a: G.champion, b: fin, sa: 0, sb: 0, n: 0, hist: { a: [], b: [] }, sudden: false };
  G.step = "duelintro";
  render();
}
function duelTurnSide() { return G.duel.n % 2 === 0 ? "b" : "a"; } // le challenger commence
function duelAsk() {
  const d = G.duel, side = duelTurnSide(), who = d[side];
  const q = pickQuestion(G.themes[rnd(G.themes.length)]);
  G.cur = { q, mode: "carre", opts: shuffle([q.a].concat(q.d)), pick: null, ok: null, side };
  G.step = "duelq";
  render();
  if (who.bot) setTimeout(() => { const acc = who.acc; duelAnswer(Math.random() < acc ? G.cur.q.a : G.cur.opts.find((o) => o !== G.cur.q.a)); }, 1700);
  else if (G.mode === "solo") startClock(30, () => { if (G.step === "duelq") duelAnswer(null); });
}
function duelAnswer(opt) {
  stopTimer();
  const d = G.duel, c = G.cur;
  c.pick = opt; c.ok = opt === c.q.a;
  if (c.ok) d[c.side === "a" ? "sa" : "sb"]++;
  d.hist[c.side].push(c.ok);
  d.n++;
  beep(c.ok ? "ok" : "no");
  G.step = "duelres";
  render();
}
function duelNext() {
  const d = G.duel, qa = d.hist.a.length, qb = d.hist.b.length;
  if (!d.sudden) {
    const remA = DUEL_Q - qa, remB = DUEL_Q - qb;
    if (d.sa > d.sb + remB || d.sb > d.sa + remA) { endDuel(); return; }
    if (qa >= DUEL_Q && qb >= DUEL_Q) { if (d.sa !== d.sb) { endDuel(); return; } d.sudden = true; }
  } else if (qa === qb) {
    if (d.sa !== d.sb) { endDuel(); return; }
    if (qa - DUEL_Q >= 3) { endDuel(); return; } // 3 échanges de mort subite sans vainqueur : le champion garde sa place
  }
  duelAsk();
}
function endDuel() {
  const d = G.duel, champWins = d.sa >= d.sb;
  G.result = { winner: champWins ? d.a : d.b, champWins, newChamp: !champWins };
  finish();
}
function finish() {
  stopTimer();
  const r = G.result;
  if (G.mode === "team") {
    if (r.newChamp) { P.team.champ = r.winner.name; P.team.reign = 1; }
    else P.team.reign++;
    P.team.hall = [{ name: P.team.champ, reign: P.team.reign, d: new Date().toLocaleDateString("fr-FR") }].concat((P.team.hall || []).filter((h) => h.name !== P.team.champ)).slice(0, 8);
  } else {
    P.solo.games++;
    const youWin = r.winner.human;
    if (youWin) { P.solo.reign++; P.solo.wins++; P.solo.cagnotte += 100; }
    else P.solo.reign = 0;
    P.solo.best = Math.max(P.solo.best, P.solo.reign);
  }
  saveP();
  G.step = "end";
  beep("win");
  render();
}

    }
    case "simdone":
      return hud("Qualifications des challengers") + '<div class="qcard"><h2>' + esc(G.simWinner.name) + " a remporté les qualifications.</h2><p style=\"margin-top:8px\">Vous êtes dans le fauteuil depuis " + P.solo.reign + " partie" + (P.solo.reign > 1 ? "s" : "") + ". Défendez votre place : " + DUEL_Q + " questions chacun, en alternance.</p></div><div class=\"next\"><button class=\"btn\" data-act=\"simduel\">Commencer le duel</button></div>";
    case "duelintro": {
      const d = G.duel;
      return hud("Le duel") + '<div class="endscene"><div class="chair">' + CHAIR + '<div class="plaque"><b>' + esc(d.a.name) + '</b><span>dans le fauteuil</span></div></div><div><h1>' + esc(d.b.name) + " défie " + esc(d.a.name) + '</h1><p class="lead">' + DUEL_Q + " questions Carré chacun, en alternance. Le challenger commence. Une bonne réponse vaut 1 point. En cas d'égalité : mort subite.</p><button class=\"btn\" data-act=\"duelgo\">Première question</button></div></div>";
    }
    case "duelq":
    case "duelres": {
      const d = G.duel, res = G.step === "duelres", who = d[c.side];
      const side = (k) => '<div class="duelside ' + (c.side === k && !res ? "on" : "") + '"><span class="avatar ' + (k === "a" ? "champ" : "") + '">' + esc(ini(d[k].name)) + "</span><div><b>" + esc(d[k].name) + "</b><div class=\"dots\">" + Array.from({ length: Math.max(DUEL_Q, d.hist[k].length) }, (_, i) => '<span class="' + (d.hist[k][i] === true ? "ok" : d.hist[k][i] === false ? "no" : "") + '"></span>').join("") + '</div></div><span class="sc">' + d[k === "a" ? "sa" : "sb"] + "</span></div>";
      return hud("Le duel" + (d.sudden ? " · mort subite" : ""), "Question pour " + esc(who.name)) + '<div class="duelbar">' + side("b") + '<span class="vs">VS</span>' + side("a") + '</div><div class="qcard"><p class="tn">' + themeName(c.q.theme) + "</p><h2>" + esc(c.q.q) + '</h2></div><div class="answers">' + c.opts.map((o, i) => { let cl = ""; if (res) { if (o === c.q.a) cl = "ok"; else if (o === c.pick) cl = "no"; } return '<button class="ans ' + cl + '" data-act="duelans" data-i="' + i + '" ' + (res || who.bot ? "disabled" : "") + "><i>" + "ABCD"[i] + "</i>" + esc(o) + "</button>"; }).join("") + "</div>" +
        (res ? '<p class="verdict ' + (c.ok ? "ok" : "no") + '">' + (c.ok ? esc(who.name) + " marque le point !" : c.pick === null ? "Temps écoulé." : esc(who.name) + " se trompe.") + '</p><div class="next"><button class="btn" data-act="duelnext">Continuer</button></div>' : who.bot ? '<p class="botline">' + esc(who.name) + " réfléchit…</p>" : G.mode === "solo" ? '<div class="timer"><i id="tbar"></i></div>' : "");
    }
    case "end": {
      const r = G.result, w = r.winner;
      if (r.eliminated) return '<div class="endscene"><div class="chair">' + CHAIR + '<div class="plaque"><b>' + esc(G.champion.name) + '</b><span>Champion</span></div></div><div><h1>Vous êtes éliminé(e)</h1><p class="lead">Le fauteuil attendra ! Relisez les fiches mémo des thèmes où vous avez hésité, puis retentez votre chance.</p><div class="row"><button class="btn" data-act="solo">Rejouer</button><button class="btn ghost" data-act="home">Accueil</button></div></div></div>';
      let title, text;
      if (r.noChamp) { title = esc(w.name) + " s'installe dans le fauteuil"; text = "Le fauteuil était libre : le vainqueur des qualifications devient champion. À la prochaine partie, il attendra son challenger."; }
      else if (r.newChamp) { title = esc(w.name) + " prend la place !"; text = esc(G.duel.a.name) + " quitte le fauteuil. Score du duel : " + G.duel.sb + " à " + G.duel.sa + "."; }
      else { title = esc(w.name) + " garde le fauteuil"; text = "Score du duel : " + G.duel.sa + " à " + G.duel.sb + "."; }
      if (G.mode === "solo") text += w.human ? " Vous êtes champion depuis " + P.solo.reign + " partie" + (P.solo.reign > 1 ? "s" : "") + " · cagnotte " + P.solo.cagnotte + " points." : " Votre meilleur règne : " + P.solo.best + ". Retentez votre chance !";
      else text += " " + esc(P.team.champ) + " compte " + P.team.reign + " victoire" + (P.team.reign > 1 ? "s" : "") + ".";
      const champName = G.mode === "solo" ? (P.solo.reign > 0 ? P.solo.name : w.name) : P.team.champ;
      return '<div class="endscene"><div class="chair ' + (r.newChamp ? "wobble" : "") + '">' + CHAIR + '<div class="plaque"><b>' + esc(champName) + '</b><span>Champion</span></div></div><div><h1>' + title + '</h1><p class="lead">' + text + '</p><div class="row"><button class="btn" data-act="' + (G.mode === "solo" ? "solo" : "team") + '">Rejouer</button><button class="btn ghost" data-act="home">Accueil</button></div></div></div>';
    }
  }
  return "";
}
function renderThemesInfo() {
  const un = unlockedIds();
  return '<div class="panel"><h2>Les thèmes</h2><p class="sub">' + THEMES.length + " thèmes, " + THEMES.reduce((a, t) => a + t.qs.length, 0) + " questions tirées des fiches mémo. Sur cet appareil, " + un.length + " thème" + (un.length > 1 ? "s sont débloqués" : " est débloqué") + ".</p>" + themeChecks(un, false) + '<div class="next"><button class="btn" data-act="home">Retour</button></div></div>';
}
const nbsp = (h) => h.replace(/ ([?!:;»])/g, "\u00A0$1").replace(/« /g, "«\u00A0");
function render() {
  const app = $("#app");
  if (V.screen === "home") app.innerHTML = nbsp(renderHome());
  else if (V.screen === "solo") app.innerHTML = nbsp(renderSoloSetup());
  else if (V.screen === "team") app.innerHTML = nbsp(renderTeamSetup());
  else if (V.screen === "themes") app.innerHTML = nbsp(renderThemesInfo());
  else if (V.screen === "play") app.innerHTML = nbsp(renderPlay());
  $("#sndbtn").textContent = "Son : " + (P.snd ? "oui" : "non");
  const f = app.querySelector("#cashin, .tcard:not(:disabled), .mbtn:not(:disabled), .ans:not(:disabled), .next .btn");
  if (f && V.screen === "play") f.focus({ preventScroll: true });
}
function durText(n, q) {
  let tot = 0;
  for (let k = n; k >= 2; k--) tot += k * q;
  tot += 2 * DUEL_Q;
  const lo = Math.round(tot * 0.8), hi = Math.round(tot * 1.1);
  return "Environ " + tot + " questions, soit " + lo + " à " + hi + " minutes avec " + n + " équipes challengers.";
}
function readTeams() { return [...document.querySelectorAll("[data-team]")].map((i) => i.value); }

document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  switch (a) {
    case "home": stopTimer(); V.screen = "home"; G = null; render(); window.scrollTo(0, 0); return;
    case "themes": stopTimer(); V.screen = "themes"; render(); return;
    case "sound": P.snd = !P.snd; saveP(); render(); return;
    case "solo": stopTimer(); V.screen = "solo"; render(); window.scrollTo(0, 0); return;
    case "team": stopTimer(); V.screen = "team"; V.teams = V.teams || null; render(); window.scrollTo(0, 0); return;
    case "quit": if (confirm("Arrêter la partie en cours ?")) { stopTimer(); V.screen = "home"; G = null; render(); } return;
    case "solostart": {
      const n = ($("#sname").value || "").trim();
      if (!n) { const er = $("#serr"); er.hidden = false; er.textContent = "Écrivez votre prénom pour entrer en jeu."; $("#sname").focus(); return; }
      P.solo.name = n; saveP(); newGame("solo"); window.scrollTo(0, 0); return;
    }
    case "soloreset": if (confirm("Quitter le fauteuil ? Votre règne repart à zéro.")) { P.solo.reign = 0; saveP(); render(); } return;
    case "unlock": {
      const ok = (await hash($("#ppw").value || "")) === PROF_HASH;
      if (!ok) { $("#pmsg").textContent = "Mot de passe incorrect."; return; }
      P.unlockAll = !P.unlockAll; saveP(); render(); return;
    }
    case "addteam": { const t = readTeams(); t.push("Équipe " + (t.length + 1)); V.teams = t; render(); return; }
    case "delteam": { const t = readTeams(); t.splice(+b.dataset.i, 1); V.teams = t; render(); return; }
    case "teamstart": {
      const names = readTeams().map((s) => s.trim()).filter(Boolean);
      const sel = [...document.querySelectorAll("[data-th]:checked")].map((i) => i.dataset.th);
      const champ = $("#champ").value.trim();
      const er = $("#terr");
      if (names.length < 2) { er.hidden = false; er.textContent = "Il faut au moins deux équipes challengers."; return; }
      if (new Set(names.map((n) => n.toLowerCase())).size !== names.length || names.some((n) => n.toLowerCase() === champ.toLowerCase())) { er.hidden = false; er.textContent = "Donnez un nom différent à chaque équipe et au champion."; return; }
      if (!sel.length) { er.hidden = false; er.textContent = "Cochez au moins un thème."; return; }
      const lenEl = document.querySelector('input[name="len"]:checked'); P.teamLen = lenEl ? +lenEl.value : 2;
      P.teamThemes = sel; if (champ !== P.team.champ) { P.team.champ = champ; P.team.reign = champ ? 0 : 0; } saveP(); V.teams = names;
      newGame("team", names, champ || null); window.scrollTo(0, 0); return;
    }
    case "resetteam": if (confirm("Libérer le fauteuil et effacer la liste des champions ?")) { P.team = { champ: "", reign: 0, hall: [] }; saveP(); render(); } return;
    case "theme": chooseTheme(b.dataset.id); return;
    case "mode": chooseMode(b.dataset.m); return;
    case "ans": answer(G.cur.opts[+b.dataset.i]); return;
    case "cashsend": stopTimer(); G.cur.cash = ($("#cashin").value || "").trim(); G.cur.revealed = true; render(); return;
    case "reveal": G.cur.revealed = true; render(); return;
    case "cashok": cashVerdict(true); return;
    case "cashno": cashVerdict(false); return;
    case "nextturn": nextTurn(); return;
    case "tiestart": startTie(); return;
    case "tieans": tieAnswer(G.cur.opts[+b.dataset.i]); return;
    case "tienext": tieNext(); return;
    case "afterround": afterRound(); return;
    case "simduel": G.duel = { a: { name: P.solo.name, human: true }, b: Object.assign(G.simWinner, { acc: Math.min(0.9, 0.6 + 0.05 * P.solo.reign) }), sa: 0, sb: 0, n: 0, hist: { a: [], b: [] }, sudden: false }; G.step = "duelintro"; render(); return;
    case "duelgo": duelAsk(); return;
    case "duelans": duelAnswer(G.cur.opts[+b.dataset.i]); return;
    case "duelnext": duelNext(); return;
  }
});
document.addEventListener("change", (e) => {
  if (e.target.name === "len" || e.target.dataset.team != null) { const d = $("#dur"); if (d) d.textContent = durText(readTeams().filter((x) => x.trim()).length, +document.querySelector('input[name="len"]:checked').value); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "cashin") { e.preventDefault(); const b = document.querySelector('[data-act="cashsend"]'); if (b) b.click(); }
  if (V.screen === "play" && G && /^[a-dA-D]$/.test(e.key) && e.target.tagName !== "INPUT") {
    const btn = document.querySelectorAll(".ans:not(:disabled)")["abcd".indexOf(e.key.toLowerCase())];
    if (btn) btn.click();
  }
});
render();
</script>
</body>
</html>
